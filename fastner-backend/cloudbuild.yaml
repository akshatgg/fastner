# Cloud Build → Cloud Run pipeline for the Fastner backend.
# Triggered on every push to master (see the trigger created via gcloud).
#
# Runtime config lives on the Cloud Run service, not here: secrets come from
# Secret Manager and plain values from --set-env-vars, so this file carries no
# credentials and is safe in a public repo.

substitutions:
  _REGION: us-central1
  _SERVICE: fastner-backend
  _REPO: fastner
  _SQL_INSTANCE: clean-framework-503217-c9:us-central1:fastner-db

steps:
  # 1. Build. Two cache-from tags so unchanged dependency layers are reused.
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push both tags.
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 3. Run Alembic against Cloud SQL before the new revision serves traffic, so
  #    the schema is never behind the code. Uses the just-built image.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: migrate
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy ${_SERVICE}-migrate \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA \
          --region ${_REGION} \
          --set-cloudsql-instances ${_SQL_INSTANCE} \
          --set-secrets DATABASE_URL=fastner-db-url:latest \
          --command alembic --args upgrade,head \
          --max-retries 1 --task-timeout 10m \
          --execute-now --wait

  # 3b. Seed the catalog (idempotent) against Cloud SQL, after the schema is
  #     migrated and before traffic shifts, so the deployed storefront's
  #     category tree and detailed products (data/products/*.json) match local.
  #     Safe to re-run: categories/products are upserted by name/SKU, and
  #     admin-managed fields (price, stock, is_active, images) are never touched.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: seed
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy ${_SERVICE}-seed \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA \
          --region ${_REGION} \
          --set-cloudsql-instances ${_SQL_INSTANCE} \
          --set-secrets DATABASE_URL=fastner-db-url:latest \
          --command python --args=-m,app.catalog.seed \
          --max-retries 1 --task-timeout 10m \
          --execute-now --wait

  # 4. Roll out. Only reached if the migration and seed jobs succeeded.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
