# Cloud Build → Cloud Run pipeline for the Fastner storefront.
# Triggered on every push to master (see the trigger created via gcloud).
#
# NEXT_PUBLIC_* values are baked into the client bundle at BUILD time, so they
# are passed as --build-arg here rather than set on the Cloud Run service. They
# are all publishable values (no secrets) — the API base URL, the site origin
# and the Cloudinary cloud name / unsigned preset.

substitutions:
  _REGION: us-central1
  _SERVICE: fastner-frontend
  _REPO: fastner
  _API_BASE_URL: https://fastner-backend-921937790339.us-central1.run.app
  _SITE_URL: https://fastner-frontend-921937790339.us-central1.run.app
  _CLOUDINARY_CLOUD_NAME: dhboza9eo
  _CLOUDINARY_UPLOAD_PRESET: ibc_unsigned

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${_CLOUDINARY_CLOUD_NAME}
      - --build-arg
      - NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${_CLOUDINARY_UPLOAD_PRESET}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
